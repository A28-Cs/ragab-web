# Production-shaped local stack (§49). `migrate` runs to completion before web/worker
# start, so the app never boots against an unmigrated DB. Secrets come from .env
# (git-ignored); .env.example documents the names.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ragab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragab_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-ragab}
    ports:
      - '5435:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-ragab}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6381:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - '9002:9000'
      - '9003:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    command: ['npm', '--prefix', 'packages/server', 'run', 'db:migrate']
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ragab}:${POSTGRES_PASSWORD:-ragab_dev_pw}@postgres:5432/${POSTGRES_DB:-ragab}
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ragab}:${POSTGRES_PASSWORD:-ragab_dev_pw}@postgres:5432/${POSTGRES_DB:-ragab}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  redisdata:
  miniodata:
