name: Bug Report
description: Create a report to help us fix a bug in Ragab products
title: "[BUG]: "
labels: ["type:bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clear description of the bug.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected Component / Area
      options:
        - Customer Web (apps/web)
        - Control Center (apps/web /control-center)
        - Mobile App (Mobile/ Flutter)
        - Brand System (packages/brand)
        - UI Components (packages/ui)
        - API Client (packages/api-client)
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step by step instructions to reproduce the issue.
    validations:
      required: true
