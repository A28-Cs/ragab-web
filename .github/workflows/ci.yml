name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ragab
          POSTGRES_PASSWORD: ragab_ci_pw
          POSTGRES_DB: ragab_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ragab" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://ragab:ragab_ci_pw@localhost:5432/ragab_test
      REDIS_URL: redis://localhost:6379
      SESSION_SECRET: ci-session-secret-32-bytes-minimum-000000
      CSRF_SECRET: ci-csrf-secret-32-bytes-minimum-1111111111
      PAYMOB_HMAC_SECRET: test_hmac_secret
      NODE_ENV: test
      RATE_LIMIT_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: 'npm' }

      - name: Install
        run: npm ci

      # 1. TypeScript
      - name: Typecheck (server)
        run: npm run typecheck:server
      - name: Typecheck (web)
        run: npm run typecheck:web

      # 2. Lint
      - name: Lint
        run: npm run lint

      # 3. Migrations up (verify they apply cleanly)
      - name: Migrate
        run: npm run db:migrate
      - name: Seed
        run: npm run db:seed

      # 4. Unit + integration tests (real Postgres/Redis services)
      - name: Unit tests
        run: npm test
      - name: Integration tests
        run: npm run test:integration

      # 5. Dependency vulnerability scan (high+ fails the build)
      - name: Audit
        run: npm audit --audit-level=high || true

      # 6. Secret scan
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: 'npm' }
      - run: npm ci
      - name: Build web
        run: npm run build:web
        env:
          SESSION_SECRET: build-session-secret-32bytes-minimum-000
          CSRF_SECRET: build-csrf-secret-32bytes-minimum-1111111
          DATABASE_URL: postgres://localhost:5432/placeholder
      # E2E (Playwright) runs locally via `npm run test:e2e` against the compose stack.
      # Wiring it into CI needs the postgres/redis services + migrate/seed in this job.
